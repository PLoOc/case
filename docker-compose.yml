version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
      - DEBUG=1
      - DATA_DIR=/tmp/localstack/data
    volumes:
      - "./infra/init-aws.sh:/docker-entrypoint-initaws.d/init-aws.sh"
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10

  processor:
    build: ./services/processor
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - RAW_EVENTS_QUEUE=raw-events
      - PROCESSED_EVENTS_QUEUE=processed-events
      - WORKER_COUNT=3
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - app-network

  aggregator:
    build: ./services/aggregator
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PROCESSED_EVENTS_QUEUE=processed-events
      - PORT=8080
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge