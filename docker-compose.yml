version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.2
    container_name: case-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs,dynamodb
      - DEBUG=0
      - LOCALSTACK_AUTH_TOKEN=
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "list-queues"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  setup:
    image: amazon/aws-cli:latest
    container_name: case-setup
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/bash -c "
        echo 'Criando DLQs...' &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name raw-events-dlq &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name processed-events-dlq &&
        echo 'Criando filas principais com RedrivePolicy...' &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name raw-events --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"arn:aws:sqs:us-east-1:000000000000:raw-events-dlq\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}'  &&
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name processed-events --attributes '{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"arn:aws:sqs:us-east-1:000000000000:processed-events-dlq\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}'  &&
        echo 'Criando tabelas DynamoDB...' &&
        aws --endpoint-url=http://localstack:4566 dynamodb create-table --table-name events --attribute-definitions AttributeName=event_id,AttributeType=S --key-schema AttributeName=event_id,KeyType=HASH --billing-mode PAY_PER_REQUEST &&
        aws --endpoint-url=http://localstack:4566 dynamodb create-table --table-name developer_summary --attribute-definitions AttributeName=developer_id,AttributeType=S --key-schema AttributeName=developer_id,KeyType=HASH --billing-mode PAY_PER_REQUEST &&
        echo 'SETUP CONCLUÍDO...'
      "
    networks:
      - app-network

  processor:
    build: ./services/processor
    container_name: case-processor
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - RAW_EVENTS_QUEUE=raw-events
      - PROCESSED_EVENTS_QUEUE=processed-events
      - WORKER_COUNT=3
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - app-network

  aggregator:
    build: ./services/aggregator
    container_name: case-aggregator
    ports:
      - "8080:8080"
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - PROCESSED_EVENTS_QUEUE=processed-events
      - PORT=8080
    depends_on:
      setup:
        condition: service_completed_successfully
    networks:
      - app-network

networks:
  app-network:
    driver: bridge